<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Power | Ecommerce</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>BLACK POWER</h1>
      </div>
      <button id="cartToggle" class="cart-btn">Cart (<span id="cartCount">0</span>)</button>
    </header>

    <main class="layout">
      <aside class="left-panel">
        <p class="panel-title">Collections</p>
        <ul>
          <li>Urban Royalty</li>
          <li>Street Legacy</li>
          <li>Night Movement</li>
          <li>Daily Unity</li>
        </ul>
      </aside>

      <section>
        <section class="stories" id="stories"></section>
        <section class="hero">
          <h2>Own the Culture. Wear the Power.</h2>
          <p>Exclusive drops designed for confidence, unity, and bold expression.</p>
        </section>
        <section class="products" id="products"></section>
      </section>

      <aside class="right-panel" id="cartPanel">
        <h3>Your Active Cart</h3>
        <div id="cartItems" class="cart-items"></div>
        <p class="total">Total: $<span id="cartTotal">0.00</span></p>
        <form id="checkoutForm" class="checkout-form">
          <input required type="text" id="customerName" placeholder="Full name" />
          <input required type="email" id="email" placeholder="Email address" />
          <textarea required id="address" placeholder="Delivery address"></textarea>
          <button type="submit">Place Order</button>
        </form>
        <p id="statusMessage" class="status"></p>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
